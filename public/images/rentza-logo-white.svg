<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="waveGrad_dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="secWaveGrad_dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
  </defs>

  <!-- MARK: House R-Icon -->
  <g transform="translate(12, 12)">
    <!-- Chimney on right roof slope -->
    <path d="M72 16 H84 V36 H72 Z" fill="#ffffff" />

    <!-- Main House Outer Shell forming 'R' -->
    <path d="M56 12
             L16 46
             V82
             C16 82 22 78 28 78
             V52
             L56 28
             L84 52
             C92 59 96 66 96 76
             C96 85 88 92 78 93
             H68
             L98 120
             H116
             L86 91
             C99 87 110 78 110 65
             C110 49 97 34 84 27
             L56 12 Z" fill="#ffffff" />

    <!-- 4 Window Panes in 2x2 grid -->
    <rect x="42" y="46" width="11" height="11" rx="2" fill="#ffffff" />
    <rect x="58" y="46" width="11" height="11" rx="2" fill="#ffffff" />
    <rect x="42" y="62" width="11" height="11" rx="2" fill="#ffffff" />
    <rect x="58" y="62" width="11" height="11" rx="2" fill="#ffffff" />

    <!-- Lower Ground Wave 1 (Upper crest) -->
    <path d="M16 84
             C28 80 44 71 58 71
             C68 71 74 77 72 87
             C69 98 52 108 32 106
             C22 104 18 97 16 84 Z" fill="url(#waveGrad_dark)" />

    <!-- Lower Ground Wave 2 (Lower sweeping path) -->
    <path d="M16 84
             C30 79 46 72 58 75
             C48 85 34 96 16 97
             Z" fill="url(#secWaveGrad_dark)" opacity="0.85" />
  </g>

  <!-- WORDMARK: Rentza -->
  <g transform="translate(148, 84)">
    <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="82" letter-spacing="-0.035em">
      <tspan fill="#ffffff">Rent</tspan><tspan fill="#fb7185">za</tspan>
    </text>
  </g>

  <!-- TAGLINE: — Find Your Home — -->
  <g transform="translate(150, 118)">
    <line x1="0" y1="-6" x2="42" y2="-6" stroke="#fb7185" stroke-width="3.5" stroke-linecap="round" />
    <text x="56" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="19" letter-spacing="0.22em" fill="#cbd5e1">FIND YOUR HOME</text>
    <line x1="288" y1="-6" x2="330" y2="-6" stroke="#fb7185" stroke-width="3.5" stroke-linecap="round" />
  </g>
</svg>