services:
  - type: web
    name: rentza
    env: node
    plan: free
    buildCommand: npm install && npm run build:css
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 4000
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: air_bnb
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
